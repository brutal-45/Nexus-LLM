[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-llm"
version = "2.0.0"
description = "Nexus-LLM - A Claude-like terminal LLM chat application with its own backend"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Nexus-LLM Team"}]
keywords = ["llm", "chat", "terminal", "ai", "gpt", "local-inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "datasets>=2.14.0",
    "peft>=0.6.0",
    "bitsandbytes>=0.41.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "click>=8.1.7",
    "markdown-it-py>=3.0.0",
    "pygments>=2.17.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "huggingface_hub>=0.19.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "black>=23.0", "ruff>=0.1.0", "mypy>=1.0"]
gpu = ["bitsandbytes>=0.41.0"]

[project.scripts]
nexus-llm = "nexus_llm.cli:cli"

[project.urls]
Repository = "https://github.com/brutal-45/Nexus-LLM"

[tool.setuptools.packages.find]
include = ["nexus_llm*"]

[tool.setuptools.package-data]
nexus_llm = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "FA", "SIM", "PIE", "RUF", "PLC", "PLE", "PLR", "PLW"]
ignore = [
    "BLE001",  # Blind exception handling (common in CLI apps)
    "E501",    # Line too long
    "PLC0415", # Import at top-level
    "PLR2004", # Magic value comparison
    "PLR0913", # Too many arguments
    "PLR0917", # Too many positional arguments
    "RUF012",  # Mutable class attribute default
    "PLW2901", # Loop variable overwritten
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "SIM102",  # Combine if statements
    "SIM105",  # Use contextlib.suppress
    "PLW0603", # Global statement
    "RUF003",  # Ambiguous unicode characters
    "RUF001",  # Ambiguous unicode characters
    "SIM108",  # Use ternary operator
    "RUF005",  # Collection literal concatenation
    "E741",    # Ambiguous variable name
    "RUF002",  # Ambiguous en dash in docstring
    "PLR0915", # Too many statements
    "PLR1714", # Repeated equality check
    "PLW1510", # subprocess without check
    "SIM113",  # Use enumerate
    "RUF006",  # asyncio task not awaited
    "PLW1508", # Invalid envvar default
    "PLC0206", # Dict items extraction
    "UP035",   # Deprecated typing import
    "SIM115",  # Context manager for file open
    "PLW0108", # Lambda assignment
    "RUF034",  # Unnecessary dict comprehension
    "F811",    # Redefined but unused
    "F401",    # Unused imports (conditional imports are common)
    "F821",    # Undefined names (some runtime checks)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
